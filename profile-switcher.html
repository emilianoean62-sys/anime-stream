<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Who's Watching? - Darklands</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --darklands-orange: #F47521;
            --darklands-dark: #0e0e0e;
            --darklands-gray: #1a1a1a;
            --darklands-text: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0e0e0e 0%, #1a1a1a 100%);
            color: var(--darklands-text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .profile-page-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .profile-header {
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, transparent 100%);
            padding: 2rem 0;
            text-align: center;
        }

        .profile-logo {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--darklands-orange);
            margin-bottom: 1rem;
        }

        .profile-title {
            font-size: 3rem;
            font-weight: bold;
            color: white;
            margin-bottom: 0.5rem;
        }

        .profile-subtitle {
            font-size: 1.2rem;
            color: #9ca3af;
            margin-bottom: 2rem;
        }

        .profiles-container {
            flex: 1;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .profiles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 2rem;
            max-width: 1200px;
            width: 100%;
            margin-bottom: 3rem;
        }

        .profile-card {
            background: rgba(26, 26, 26, 0.8);
            border-radius: 1rem;
            padding: 1.5rem;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            border: 2px solid transparent;
        }

        .profile-card:hover {
            transform: translateY(-8px);
            border-color: var(--darklands-orange);
            box-shadow: 0 20px 40px rgba(244, 117, 33, 0.3);
        }

        .profile-card.active {
            border-color: var(--darklands-orange);
            box-shadow: 0 0 30px rgba(244, 117, 33, 0.5);
        }

        .profile-banner {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 100px;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            z-index: 1;
        }

        .profile-avatar-container {
            position: relative;
            z-index: 2;
            margin-bottom: 1rem;
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 4px solid var(--darklands-orange);
            object-fit: cover;
            margin: 0 auto;
            display: block;
        }

        .profile-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            margin-bottom: 0.5rem;
            z-index: 2;
            position: relative;
        }

        .profile-email {
            font-size: 0.9rem;
            color: #9ca3af;
            margin-bottom: 0.5rem;
            z-index: 2;
            position: relative;
        }

        .profile-type {
            font-size: 0.8rem;
            color: var(--darklands-orange);
            font-weight: 600;
            z-index: 2;
            position: relative;
        }

        .profile-actions {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            margin-top: 1rem;
            z-index: 2;
            position: relative;
        }

        .action-btn {
            padding: 0.5rem;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .edit-btn {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
        }

        .edit-btn:hover {
            background: rgba(59, 130, 246, 0.4);
            transform: scale(1.1);
        }

        .delete-btn {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
        }

        .delete-btn:hover {
            background: rgba(239, 68, 68, 0.4);
            transform: scale(1.1);
        }

        .add-profile-card {
            background: rgba(26, 26, 26, 0.4);
            border: 2px dashed #4b5563;
            border-radius: 1rem;
            padding: 1.5rem;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 250px;
        }

        .add-profile-card:hover {
            border-color: var(--darklands-orange);
            background: rgba(244, 117, 33, 0.1);
            transform: translateY(-4px);
        }

        .add-icon {
            font-size: 3rem;
            color: #6b7280;
            margin-bottom: 1rem;
        }

        .add-text {
            font-size: 1.1rem;
            color: #9ca3af;
            font-weight: 600;
        }

        .page-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .action-button {
            padding: 1rem 2rem;
            border-radius: 0.5rem;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .primary-btn {
            background: var(--darklands-orange);
            color: white;
        }

        .primary-btn:hover {
            background: #e55a1a;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(244, 117, 33, 0.3);
        }

        .secondary-btn {
            background: rgba(75, 85, 99, 0.3);
            color: #d1d5db;
            border: 1px solid #4b5563;
        }

        .secondary-btn:hover {
            background: rgba(75, 85, 99, 0.5);
            transform: translateY(-2px);
        }

        /* Modal Styles */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal.show {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: #1a1a1a;
            border-radius: 1rem;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .modal.show .modal-content {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
        }

        .close-btn {
            background: none;
            border: none;
            color: #9ca3af;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 50%;
            transition: all 0.2s ease;
        }

        .close-btn:hover {
            background: rgba(156, 163, 175, 0.2);
            color: white;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            color: white;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem;
            background: #2d2d2d;
            border: 1px solid #4b5563;
            border-radius: 0.5rem;
            color: white;
            font-size: 1rem;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--darklands-orange);
            box-shadow: 0 0 0 3px rgba(244, 117, 33, 0.1);
        }

        .avatar-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            max-height: 200px;
            overflow-y: auto;
        }

        .avatar-option {
            padding: 0.5rem;
            border-radius: 0.5rem;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .avatar-option:hover {
            border-color: var(--darklands-orange);
            background: rgba(244, 117, 33, 0.1);
        }

        .avatar-option.selected {
            border-color: var(--darklands-orange);
            background: rgba(244, 117, 33, 0.2);
        }

        .avatar-img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 0.5rem;
            display: block;
        }

        .avatar-name {
            font-size: 0.8rem;
            color: #9ca3af;
        }

        .banner-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            max-height: 200px;
            overflow-y: auto;
        }

        .banner-option {
            aspect-ratio: 16/9;
            border-radius: 0.5rem;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            overflow: hidden;
        }

        .banner-option:hover {
            border-color: var(--darklands-orange);
        }

        .banner-option.selected {
            border-color: var(--darklands-orange);
            box-shadow: 0 0 0 3px rgba(244, 117, 33, 0.3);
        }

        .banner-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .form-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            margin-top: 2rem;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: var(--darklands-orange);
            color: white;
        }

        .btn-primary:hover {
            background: #e55a1a;
        }

        .btn-secondary {
            background: #4b5563;
            color: white;
        }

        .btn-secondary:hover {
            background: #6b7280;
        }

        .btn-danger {
            background: #dc2626;
            color: white;
        }

        .btn-danger:hover {
            background: #b91c1c;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .profiles-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 1rem;
            }

            .profile-title {
                font-size: 2rem;
            }

            .profiles-container {
                padding: 1rem;
            }
        }

        @media (max-width: 480px) {
            .profiles-grid {
                grid-template-columns: 1fr;
            }

            .page-actions {
                flex-direction: column;
                align-items: center;
            }

            .action-button {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="profile-page-container">
        <!-- Header -->
        <div class="profile-header">
            <div class="profile-logo">Darklands</div>
            <h1 class="profile-title">Who's Watching?</h1>
            <p class="profile-subtitle">Choose your profile to continue</p>
        </div>

        <!-- Profiles Container -->
        <div class="profiles-container">
            <div id="profilesGrid" class="profiles-grid">
                <!-- Profiles will be loaded here -->
            </div>

            <!-- Page Actions -->
            <div class="page-actions">
                <button onclick="goBack()" class="action-button secondary-btn">
                    <i class="fas fa-arrow-left"></i>
                    Back to Darklands
                </button>
                <button onclick="showAddProfileModal()" class="action-button primary-btn">
                    <i class="fas fa-plus"></i>
                    Add Profile
                </button>
            </div>
        </div>
    </div>

    <!-- Add/Edit Profile Modal -->
    <div id="profileModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle" class="modal-title">Add Profile</h2>
                <button onclick="hideProfileModal()" class="close-btn">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <form id="profileForm">
                <div class="form-group">
                    <label class="form-label">Profile Name</label>
                    <input type="text" id="profileName" class="form-input" placeholder="Enter profile name" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" id="profileUsername" class="form-input" placeholder="Enter username">
                </div>

                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" id="profileEmail" class="form-input" placeholder="Enter email">
                </div>

                <div class="form-group">
                    <label class="form-label">Choose Avatar</label>
                    <div id="avatarGrid" class="avatar-grid">
                        <!-- Avatars will be loaded here -->
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Choose Banner</label>
                    <div id="bannerGrid" class="banner-grid">
                        <!-- Banners will be loaded here -->
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" onclick="hideProfileModal()" class="btn btn-secondary">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Profile</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Delete Profile</h2>
                <button onclick="hideDeleteModal()" class="close-btn">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <p style="color: #9ca3af; margin-bottom: 2rem;">Are you sure you want to delete this profile? This action cannot be undone.</p>

            <div class="form-actions">
                <button onclick="hideDeleteModal()" class="btn btn-secondary">Cancel</button>
                <button onclick="confirmDeleteProfile()" class="btn btn-danger">Delete Profile</button>
            </div>
        </div>
    </div>

    <script>
        // Profile Management System
        let profiles = [];
        let currentProfile = null;
        let selectedAvatar = null;
        let selectedBanner = null;
        let editingProfileId = null;
        let deleteProfileId = null;

        // Anime Avatars
        const animeAvatars = [
            { name: 'Naruto Uzumaki', url: 'https://cdn.myanimelist.net/images/characters/2/284121.jpg' },
            { name: 'Sasuke Uchiha', url: 'https://cdn.myanimelist.net/images/characters/2/284122.jpg' },
            { name: 'Monkey D. Luffy', url: 'https://cdn.myanimelist.net/images/characters/2/284123.jpg' },
            { name: 'Roronoa Zoro', url: 'https://cdn.myanimelist.net/images/characters/2/284124.jpg' },
            { name: 'Tanjiro Kamado', url: 'https://cdn.myanimelist.net/images/characters/2/284125.jpg' },
            { name: 'Nezuko Kamado', url: 'https://cdn.myanimelist.net/images/characters/2/284126.jpg' },
            { name: 'Son Goku', url: 'https://cdn.myanimelist.net/images/characters/2/284127.jpg' },
            { name: 'Vegeta', url: 'https://cdn.myanimelist.net/images/characters/2/284128.jpg' },
            { name: 'Ichigo Kurosaki', url: 'https://cdn.myanimelist.net/images/characters/2/284129.jpg' },
            { name: 'Eren Yeager', url: 'https://cdn.myanimelist.net/images/characters/2/284130.jpg' },
            { name: 'Mikasa Ackerman', url: 'https://cdn.myanimelist.net/images/characters/2/284131.jpg' },
            { name: 'Levi Ackerman', url: 'https://cdn.myanimelist.net/images/characters/2/284132.jpg' },
            { name: 'Edward Elric', url: 'https://cdn.myanimelist.net/images/characters/2/284133.jpg' },
            { name: 'Light Yagami', url: 'https://cdn.myanimelist.net/images/characters/2/284134.jpg' },
            { name: 'L Lawliet', url: 'https://cdn.myanimelist.net/images/characters/2/284135.jpg' },
            { name: 'Kakashi Hatake', url: 'https://cdn.myanimelist.net/images/characters/2/284136.jpg' },
            { name: 'Itachi Uchiha', url: 'https://cdn.myanimelist.net/images/characters/2/284137.jpg' },
            { name: 'Hinata Hyuga', url: 'https://cdn.myanimelist.net/images/characters/2/284138.jpg' }
        ];

        // Anime Banners
        const animeBanners = [
            { name: 'Naruto Shippuden', url: 'https://cdn.myanimelist.net/images/anime/5/17407.jpg' },
            { name: 'One Piece', url: 'https://cdn.myanimelist.net/images/anime/6/73245.jpg' },
            { name: 'Demon Slayer', url: 'https://cdn.myanimelist.net/images/anime/1286/99889.jpg' },
            { name: 'Dragon Ball Z', url: 'https://cdn.myanimelist.net/images/anime/6/73245.jpg' },
            { name: 'Attack on Titan', url: 'https://cdn.myanimelist.net/images/anime/10/47347.jpg' },
            { name: 'Bleach', url: 'https://cdn.myanimelist.net/images/anime/3/40451.jpg' },
            { name: 'Fullmetal Alchemist', url: 'https://cdn.myanimelist.net/images/anime/5/17407.jpg' },
            { name: 'Death Note', url: 'https://cdn.myanimelist.net/images/anime/9/9453.jpg' },
            { name: 'My Hero Academia', url: 'https://cdn.myanimelist.net/images/anime/10/78745.jpg' },
            { name: 'Hunter x Hunter', url: 'https://cdn.myanimelist.net/images/anime/5/17407.jpg' },
            { name: 'Tokyo Ghoul', url: 'https://cdn.myanimelist.net/images/anime/5/17407.jpg' },
            { name: 'Jujutsu Kaisen', url: 'https://cdn.myanimelist.net/images/anime/1171/109222.jpg' }
        ];

        // Initialize the page
        document.addEventListener('DOMContentLoaded', function() {
            initializeProfiles();
            loadProfilesGrid();
            loadAvatarGrid();
            loadBannerGrid();
            setupEventListeners();
        });

        function initializeProfiles() {
            const savedProfiles = localStorage.getItem('darklands_profiles');
            if (savedProfiles) {
                profiles = JSON.parse(savedProfiles);
            } else {
                // Create default profiles
                profiles = [
                    {
                        id: 'admin',
                        name: 'Admin',
                        username: 'admin',
                        email: 'admin@darklands.com',
                        avatar: animeAvatars[0].url,
                        banner: animeBanners[0].url,
                        type: 'admin',
                        isDefault: true,
                        createdAt: Date.now()
                    },
                    {
                        id: 'guest',
                        name: 'Guest',
                        username: 'guest',
                        email: 'guest@darklands.com',
                        avatar: animeAvatars[1].url,
                        banner: animeBanners[1].url,
                        type: 'guest',
                        isDefault: true,
                        createdAt: Date.now()
                    },
                    {
                        id: 'ultimate',
                        name: 'Ultimate',
                        username: 'ultimate',
                        email: 'ultimate@darklands.com',
                        avatar: animeAvatars[2].url,
                        banner: animeBanners[2].url,
                        type: 'premium',
                        isDefault: true,
                        createdAt: Date.now()
                    },
                    {
                        id: 'anime_fan',
                        name: 'Anime Fan',
                        username: 'anime_fan',
                        email: 'anime_fan@darklands.com',
                        avatar: animeAvatars[3].url,
                        banner: animeBanners[3].url,
                        type: 'user',
                        isDefault: true,
                        createdAt: Date.now()
                    }
                ];
                saveProfiles();
            }

            // Set current profile
            const savedCurrentProfile = localStorage.getItem('darklands_current_profile');
            if (savedCurrentProfile) {
                currentProfile = profiles.find(p => p.id === savedCurrentProfile) || profiles[0];
            } else {
                currentProfile = profiles[0];
            }
        }

        function saveProfiles() {
            localStorage.setItem('darklands_profiles', JSON.stringify(profiles));
        }

        function saveCurrentProfile() {
            localStorage.setItem('darklands_current_profile', currentProfile.id);
        }

        function loadProfilesGrid() {
            const grid = document.getElementById('profilesGrid');
            grid.innerHTML = profiles.map(profile => `
                <div class="profile-card ${currentProfile.id === profile.id ? 'active' : ''}" onclick="switchProfile('${profile.id}')">
                    <div class="profile-banner" style="background-image: url('${profile.banner}'); background-size: cover; background-position: center;"></div>
                    <div class="profile-avatar-container">
                        <img src="${profile.avatar}" alt="${profile.name}" class="profile-avatar">
                    </div>
                    <h3 class="profile-name">${profile.name}</h3>
                    <p class="profile-email">${profile.username || profile.email}</p>
                    <p class="profile-type">${profile.type.charAt(0).toUpperCase() + profile.type.slice(1)}</p>
                    <div class="profile-actions">
                        <button class="action-btn edit-btn" onclick="editProfile('${profile.id}'); event.stopPropagation();" title="Edit Profile">
                            <i class="fas fa-edit"></i>
                        </button>
                        ${!profile.isDefault ? `<button class="action-btn delete-btn" onclick="deleteProfile('${profile.id}'); event.stopPropagation();" title="Delete Profile">
                            <i class="fas fa-trash"></i>
                        </button>` : ''}
                    </div>
                </div>
            `).join('') + `
                <div class="add-profile-card" onclick="showAddProfileModal()">
                    <i class="fas fa-plus add-icon"></i>
                    <p class="add-text">Add Profile</p>
                </div>
            `;
        }

        function loadAvatarGrid() {
            const grid = document.getElementById('avatarGrid');
            grid.innerHTML = animeAvatars.map((avatar, index) => `
                <div class="avatar-option ${selectedAvatar === index ? 'selected' : ''}" onclick="selectAvatar(${index})">
                    <img src="${avatar.url}" alt="${avatar.name}" class="avatar-img">
                    <p class="avatar-name">${avatar.name}</p>
                </div>
            `).join('');
        }

        function loadBannerGrid() {
            const grid = document.getElementById('bannerGrid');
            grid.innerHTML = animeBanners.map((banner, index) => `
                <div class="banner-option ${selectedBanner === index ? 'selected' : ''}" onclick="selectBanner(${index})">
                    <img src="${banner.url}" alt="${banner.name}" class="banner-img">
                </div>
            `).join('');
        }

        function selectAvatar(index) {
            selectedAvatar = index;
            loadAvatarGrid();
        }

        function selectBanner(index) {
            selectedBanner = index;
            loadBannerGrid();
        }

        function switchProfile(profileId) {
            const profile = profiles.find(p => p.id === profileId);
            if (profile) {
                currentProfile = profile;
                saveCurrentProfile();
                loadProfilesGrid();
                showNotification(`Switched to ${profile.name} profile`);
                
                // Redirect back to main site after a short delay
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);
            }
        }

        function showAddProfileModal() {
            editingProfileId = null;
            document.getElementById('modalTitle').textContent = 'Add Profile';
            document.getElementById('profileForm').reset();
            selectedAvatar = null;
            selectedBanner = null;
            loadAvatarGrid();
            loadBannerGrid();
            showModal('profileModal');
        }

        function editProfile(profileId) {
            const profile = profiles.find(p => p.id === profileId);
            if (profile) {
                editingProfileId = profileId;
                document.getElementById('modalTitle').textContent = 'Edit Profile';
                document.getElementById('profileName').value = profile.name;
                document.getElementById('profileUsername').value = profile.username || '';
                document.getElementById('profileEmail').value = profile.email || '';
                
                // Find and select current avatar and banner
                selectedAvatar = animeAvatars.findIndex(a => a.url === profile.avatar);
                selectedBanner = animeBanners.findIndex(b => b.url === profile.banner);
                
                loadAvatarGrid();
                loadBannerGrid();
                showModal('profileModal');
            }
        }

        function deleteProfile(profileId) {
            if (profiles.length <= 1) {
                showNotification('Cannot delete the last profile', 'error');
                return;
            }
            
            const profile = profiles.find(p => p.id === profileId);
            if (profile.isDefault) {
                showNotification('Cannot delete default profiles', 'error');
                return;
            }
            
            deleteProfileId = profileId;
            showModal('deleteModal');
        }

        function confirmDeleteProfile() {
            if (deleteProfileId) {
                profiles = profiles.filter(p => p.id !== deleteProfileId);
                saveProfiles();
                
                // If deleted profile was current, switch to first available
                if (currentProfile.id === deleteProfileId) {
                    currentProfile = profiles[0];
                    saveCurrentProfile();
                }
                
                loadProfilesGrid();
                hideDeleteModal();
                showNotification('Profile deleted successfully!');
            }
        }

        function setupEventListeners() {
            document.getElementById('profileForm').addEventListener('submit', function(e) {
                e.preventDefault();
                saveProfile();
            });
        }

        function saveProfile() {
            const name = document.getElementById('profileName').value.trim();
            const username = document.getElementById('profileUsername').value.trim();
            const email = document.getElementById('profileEmail').value.trim();
            
            if (!name) {
                showNotification('Please enter a profile name', 'error');
                return;
            }
            
            if (selectedAvatar === null) {
                showNotification('Please select an avatar', 'error');
                return;
            }
            
            if (selectedBanner === null) {
                showNotification('Please select a banner', 'error');
                return;
            }

            const profileData = {
                name: name,
                username: username,
                email: email,
                avatar: animeAvatars[selectedAvatar].url,
                banner: animeBanners[selectedBanner].url,
                type: 'user',
                isDefault: false,
                createdAt: Date.now()
            };

            if (editingProfileId) {
                // Edit existing profile
                const profileIndex = profiles.findIndex(p => p.id === editingProfileId);
                if (profileIndex !== -1) {
                    profiles[profileIndex] = { ...profiles[profileIndex], ...profileData };
                    showNotification('Profile updated successfully!');
                }
            } else {
                // Add new profile
                const newProfile = {
                    id: 'profile_' + Date.now(),
                    ...profileData
                };
                profiles.push(newProfile);
                showNotification('Profile created successfully!');
            }
            
            saveProfiles();
            loadProfilesGrid();
            hideProfileModal();
        }

        function showModal(modalId) {
            const modal = document.getElementById(modalId);
            modal.classList.add('show');
        }

        function hideProfileModal() {
            const modal = document.getElementById('profileModal');
            modal.classList.remove('show');
        }

        function hideDeleteModal() {
            const modal = document.getElementById('deleteModal');
            modal.classList.remove('show');
        }

        function goBack() {
            window.location.href = 'index.html';
        }

        function showNotification(message, type = 'success') {
            // Create notification element
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: ${type === 'error' ? '#dc2626' : '#10b981'};
                color: white;
                padding: 1rem 1.5rem;
                border-radius: 0.5rem;
                font-weight: 600;
                z-index: 10000;
                transform: translateX(100%);
                transition: transform 0.3s ease;
            `;
            notification.textContent = message;
            document.body.appendChild(notification);
            
            // Animate in
            setTimeout(() => {
                notification.style.transform = 'translateX(0)';
            }, 100);
            
            // Remove after 3 seconds
            setTimeout(() => {
                notification.style.transform = 'translateX(100%)';
                setTimeout(() => {
                    document.body.removeChild(notification);
                }, 300);
            }, 3000);
        }
    </script>
</body>
</html>
